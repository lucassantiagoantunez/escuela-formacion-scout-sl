{% if pagina.paginator.num_pages > 1 %}<nav class="panel-paginacion" aria-label="Páginas del listado">{% if pagina.has_previous %}<a href="?{{ parametros }}&pagina={{ pagina.previous_page_number }}">← Anterior</a>{% endif %}<span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }} · {{ pagina.paginator.count }} resultados</span>{% if pagina.has_next %}<a href="?{{ parametros }}&pagina={{ pagina.next_page_number }}">Siguiente →</a>{% endif %}</nav>{% endif %}
